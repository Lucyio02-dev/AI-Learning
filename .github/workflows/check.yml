name: Validate learning lab
on:
  pull_request:
  push:
    branches: [main, feat/learning-lab-v2]
  workflow_call:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 应用运行时零第三方 npm 依赖；Playwright 仅用于端到端回归。
      - run: npm ci
      - name: Install Python deps for syntax check
        run: python -m pip install numpy
      - run: npm run check
      - run: npm test
      - run: npm run pycheck
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end regression
        run: npm run e2e
      - name: Verify backend boots and serves health
        run: |
          node server/index.js &
          sleep 2
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"ok":true'
          curl -fsS -o /dev/null -w "%{http_code}" http://127.0.0.1:8787/ | grep -q 200
