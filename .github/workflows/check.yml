name: Validate learning lab
on:
  pull_request:
  push:
    branches: [main, feat/learning-lab-v2]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: python -m py_compile experiments/inference.py
